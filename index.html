<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#020205" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@200;300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --gold: #f7dfb5;
    --gold-bright: #fff8eb;
    --gold-dim: rgba(247, 223, 181, 0.3);
    --bg-dark: #020205;
    --glass: rgba(15, 15, 25, 0.5);
    --glass-border: rgba(255, 255, 255, 0.15);
  }

  html, body { height: 100%; overflow: hidden; background-color: var(--bg-dark); }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff; display: flex; justify-content: center; align-items: center;
    perspective: 1500px; background: radial-gradient(circle at 50% 0%, #0a0a18 0%, #020205 80%);
  }

  /* ================= EFEK LAYAR ================= */
  .noise {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.06;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    mix-blend-mode: overlay;
  }
  .vignette {
    position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
  }

  #canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ================= STAGE (LANDING) ================= */
  .stage {
    position: relative; z-index: 10; text-align: center; transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .stage.hidden { opacity: 0; transform: scale(1.5) translateZ(200px); pointer-events: none; filter: blur(20px); }

  /* Efek Emas Berkilau */
  .title {
    font-family: 'Cinzel', serif; font-size: clamp(3.2rem, 14vw, 5rem); font-weight: 700;
    background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 5px; margin-bottom: 5px; 
    animation: shimmer 4s linear infinite, revealUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    filter: drop-shadow(0 10px 30px rgba(247,223,181,0.3));
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .subtitle {
    font-size: 0.7rem; font-weight: 300; letter-spacing: 8px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 50px; animation: revealUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    opacity: 0.8;
  }

  .btn {
    position: relative; overflow: hidden; padding: 18px 50px; 
    background: rgba(247, 223, 181, 0.05); border: 1px solid var(--gold-dim);
    border-radius: 50px; color: var(--gold-bright); font-family: inherit; font-size: 0.9rem; font-weight: 600; letter-spacing: 3px;
    cursor: pointer; animation: revealUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
    box-shadow: 0 0 40px rgba(247,223,181,0.15), inset 0 0 20px rgba(247,223,181,0.1);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .btn:active { transform: scale(0.9); background: var(--gold); color: #000; }
  
  @keyframes revealUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(10px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* ================= OVERLAY & 3D CARDS ================= */
  .overlay {
    position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: all 1s ease;
    background: rgba(2,2,5,0.3); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .scene-container {
    width: 90vw; max-width: 400px; height: 600px; max-height: 80vh;
    position: relative; transform-style: preserve-3d;
    transition: transform 0.1s linear;
  }

  /* Animasi Flip 3D Sinematik */
  .card {
    position: absolute; inset: 0; padding: 45px 30px;
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
    border-radius: 32px; border: 1px solid var(--glass-border);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow-y: auto; overscroll-behavior: contain;
    
    opacity: 0; visibility: hidden;
    transform: rotateY(90deg) translateX(200px) scale(0.8);
    filter: blur(20px) brightness(0.2);
    transition: all 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    transform-style: preserve-3d;
    transform-origin: center right;
  }

  .card.active {
    opacity: 1; visibility: visible;
    transform: rotateY(0deg) translateX(0) scale(1);
    filter: blur(0) brightness(1);
    z-index: 10;
    transform-origin: center center;
  }
  
  .card.exit {
    opacity: 0; visibility: hidden;
    transform: rotateY(-90deg) translateX(-200px) scale(0.8);
    filter: blur(20px) brightness(0.2);
    transform-origin: center left;
    z-index: 5;
  }

  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.1), transparent 40%),
                linear-gradient(120deg, rgba(255,255,255,0.03) 0%, transparent 20%, transparent 80%, rgba(247,223,181,0.05) 100%);
  }

  .close {
    position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #aaa; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50; transform: translateZ(30px); transition: 0.3s;
  }
  .close:active { background: var(--gold); color: #000; transform: translateZ(30px) rotate(90deg); }

  .content-wrap { transform: translateZ(20px); }
  
  .msg {
    font-size: 1.05rem; line-height: 1.9; font-weight: 300; color: #eaeaea;
    text-align: left; min-height: 120px; letter-spacing: 0.5px;
  }
  .msg-line { display: block; min-height: 1.6em; opacity: 0; transform: translateY(15px) scale(0.95); transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .msg-line.visible { opacity: 1; transform: translateY(0) scale(1); }
  
  .cursor {
    display: inline-block; width: 7px; height: 1.1em; background: var(--gold);
    margin-left: 3px; vertical-align: -2px; animation: blink 0.8s steps(1) infinite;
    box-shadow: 0 0 15px var(--gold);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ================= SAILING SCENE ================= */
  .scene {
    width: 100%; aspect-ratio: 16/11; margin: 25px 0 15px; border-radius: 16px;
    overflow: hidden; position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
    opacity: 0; transform: translateY(30px) scale(0.9); transition: 1.2s cubic-bezier(0.16,1,0.3,1);
    transform-style: preserve-3d;
  }
  .scene.visible { opacity: 1; transform: translateY(0) scale(1); }
  .scene svg { width: 100%; height: 100%; display: block; }

  .water-layer { animation: wave 10s linear infinite; }
  .water-layer.layer-2 { animation-duration: 15s; animation-direction: reverse; }
  .water-layer.layer-3 { animation-duration: 20s; }
  @keyframes wave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  
  .boat-wrap { transform-box: view-box; transform-origin: 200px 140px; animation: rock 6s ease-in-out infinite; }
  @keyframes rock { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }

  .moon-pulse { animation: pulse 5s infinite alternate; transform-origin: center; }
  @keyframes pulse { 0% { opacity: 0.8; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1.03); } }

  .shooting-star { animation: shoot 4s ease-in infinite; }
  @keyframes shoot {
    0% { transform: translate(350px, 10px); opacity: 1; }
    15% { transform: translate(200px, 60px); opacity: 0; }
    100% { transform: translate(200px, 60px); opacity: 0; }
  }

  .signature {
    font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--gold-bright);
    text-align: right; margin-top: 20px; opacity: 0; transform: translateY(20px); transition: 1s ease 0.8s;
    text-shadow: 0 5px 20px rgba(247,223,181,0.4);
  }
  .signature.visible { opacity: 1; transform: translateY(0); }

  /* ================= NAVIGATION ================= */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; transform: translateZ(25px); }
  .nav-btn {
    background: transparent; border: none; color: var(--gold-dim);
    font-family: inherit; font-size: 0.8rem; font-weight: 600; letter-spacing: 2px;
    display: none; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; transition: 0.3s;
  }
  .nav-btn.show { display: flex; animation: fadeIn 0.6s ease; }
  .nav-btn:active { color: var(--gold); transform: scale(0.9); }
  .nav-btn svg { width: 16px; height: 16px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ================= MUSIC PLAYER ================= */
  .music {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 20px)); left: 20px;
    display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px;
    background: rgba(5,5,10,0.8); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
    border-radius: 50px; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform: translateY(30px);
  }
  body.modal-open .music { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .music svg { width: 14px; height: 14px; fill: var(--gold); }
  .icon { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }
  .bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
  .bar { width: 2.5px; height: 100%; background: var(--gold); border-radius: 2px; transform-origin: bottom; transform: scaleY(0.2); }
  .music.playing .bar { animation: eq 0.7s ease-in-out infinite alternate; }
  .music.playing .bar:nth-child(1) { animation-duration: 0.5s; }
  .music.playing .bar:nth-child(2) { animation-duration: 0.8s; }
  .music.playing .bar:nth-child(3) { animation-duration: 0.6s; }
  .music.playing .bar:nth-child(4) { animation-duration: 0.9s; }
  @keyframes eq { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
</style>
</head>
<body>

  <div class="noise"></div>
  <div class="vignette"></div>
  <canvas id="canvas"></canvas>

    <source src="https://archive.org/download/lobo_20250503/Lobo.mp3" type="audio/mpeg">
  </audio>

  <main class="stage" id="stage">

  <div class="overlay" id="overlay">

      <div class="card active" id="card0">

          <p class="msg" id="msg0"></p>
          <div class="nav">
            <button class="nav-btn next" id="nextBtn">Lanjut <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
          </div>
        </div>
      </div>

      <!-- KARTU 2 -->
      <div class="card" id="card1">
        <button class="close" onclick="closeApp()">&times;</button>
        <div class="content-wrap">
          <p class="msg" id="msg1"></p>
          
          <div class="scene" id="scene1">
            <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice">
              <defs>
                <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#02020a"/><stop offset="50%" stop-color="#0d0d26"/><stop offset="100%" stop-color="#1a1835"/>
                </linearGradient>
                <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">

                </radialGradient>

              </g>

<script>
(function() {
  'use strict';

  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  /* =========================================
     1. CANVAS ENGINE: Particles, Shockwave, & Stardust
     ========================================= */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  let particles = [];
  let shockwaves = [];
  let stardust = [];
  const mouse = { x: -1000, y: -1000, radius: 150 };

  function initCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    particles = [];
    const count = isTouch ? 60 : 120;
    for (let i = 0; i < count; i++) {
      const isForeground = Math.random() > 0.7;
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        size: isForeground ? Math.random() * 4 + 2 : Math.random() * 1.5 + 0.5,
        blur: isForeground ? 3 : 0,
        color: Math.random() > 0.5 ? '247, 223, 181' : '255, 255, 255'
      });
    }
  }

  // 1. Efek Shockwave saat di-klik
  function spawnShockwave(x, y) {
    shockwaves.push({ x, y, radius: 0, maxRadius: 300, opacity: 1 });
    // Tembakan partikel
    for (let i = 0; i < 50; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 10 + 2;
      stardust.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        size: Math.random() * 4 + 1, life: 1, decay: Math.random() * 0.02 + 0.015,
        color: '255, 223, 181'
      });
    }
  }

  // 2. Efek Hujan Bintang (Slide 2)
  function spawnStardustShower() {
    for (let i = 0; i < 100; i++) {
      setTimeout(() => {
        stardust.push({
          x: Math.random() * W, y: -20,
          vx: (Math.random() - 0.5) * 2, vy: Math.random() * 3 + 1,
          size: Math.random() * 3 + 1, life: 1, decay: 0.005,
          color: '247, 223, 181'
        });
      }, Math.random() * 1500); // Jatuh bergantian
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Draw Particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      let dx = mouse.x - p.x, dy = mouse.y - p.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        p.x -= dx / dist * force * 8;
        p.y -= dy / dist * force * 8;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color}, ${Math.random() * 0.4 + 0.2})`;
      if (p.blur > 0) { ctx.shadowBlur = p.blur * 5; ctx.shadowColor = `rgba(${p.color}, 0.8)`; }
      ctx.fill();
      ctx.shadowBlur = 0; 
    });

    // Draw Shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      let sw = shockwaves[i];
      sw.radius += 8;
      sw.opacity -= 0.02;
      if (sw.opacity <= 0) { shockwaves.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(247, 223, 181, ${sw.opacity})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Draw Stardust (Ledakan/Hujan)
    for (let i = stardust.length - 1; i >= 0; i--) {
      let sd = stardust[i];
      sd.x += sd.vx; sd.y += sd.vy;
      sd.vx *= 0.96; sd.vy *= 0.96;
      sd.life -= sd.decay;
      if (sd.life <= 0) { stardust.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(sd.x, sd.y, sd.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${sd.color}, ${sd.life})`;
      ctx.shadowBlur = 10; ctx.shadowColor = `rgba(${sd.color}, ${sd.life})`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', initCanvas);
  initCanvas();
  draw();

  // Deteksi Klik Global untuk Shockwave
  window.addEventListener('pointerdown', (e) => {
    // Hanya munculkan shockwave jika layar belum penuh dengan kartu
    if(!document.getElementById('overlay').classList.contains('open')) {
      spawnShockwave(e.clientX, e.clientY);
    }
  });

  /* =========================================
     2. 3D PARALLAX (Gyroscope)
     ========================================= */
  const sceneContainer = document.getElementById('sceneContainer');
  
  if (isTouch) {
    window.addEventListener('deviceorientation', (e) => {
      if (!e.gamma || !e.beta) return;
      const tiltX = Math.max(Math.min(e.gamma, 25), -25);
      const tiltY = Math.max(Math.min(e.beta - 45, 25), -25);
      
      sceneContainer.style.transform = `perspective(1200px) rotateX(${-tiltY * 0.5}deg) rotateY(${tiltX * 0.5}deg)`;
      canvas.style.transform = `translate(${-tiltX * 0.5}px, ${-tiltY * 0.5}px) scale(1.05)`;
      
      const percentX = (tiltX + 25) / 50 * 100;
      const percentY = (tiltY + 25) / 50 * 100;
      document.querySelectorAll('.card').forEach(c => {
        c.style.setProperty('--mouse-x', `${percentX}%`);
        c.style.setProperty('--mouse-y', `${percentY}%`);
      });
    });
  }

  /* =========================================
     3. LOGIKA KARTU & TYPEWRITER
     ========================================= */
  const overlay = document.getElementById('overlay');
  const openBtn = document.getElementById('openBtn');
  const stage = document.getElementById('stage');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const audio = document.getElementById('audio');
  const musicBtn = document.getElementById('musicBtn');
  const card0 = document.getElementById('card0');
  const card1 = document.getElementById('card1');
  let isPlaying = false;

  const texts = [
    'Hai Bila. Aku bikin ini bukan buat pamer, tapi murni karena pengen lihat kamu senyum hari ini. Terima kasih ya udah bertahan dan berusaha sejauh ini. Jangan lupa istirahat, aku bangga sama kamu. 🌻',
    'Masih banyak hal seru yang belum kita jelajahi. Mari berlayar, membuka hal-hal baru, bersama. Aku akan selalu ada di sini nemenin kamu.'
  ];

  let currSlide = 0;
  let typed = [false, false];
  let typeTimer;

  function typeText(idx) {
    clearTimeout(typeTimer);
    const msg = document.getElementById('msg' + idx);
    const scene = document.getElementById('scene' + idx);
    const sig = document.getElementById('sig' + idx);
    
    msg.innerHTML = '';
    if(scene) scene.classList.remove('visible');
    if(sig) sig.classList.remove('visible');

    const lines = texts[idx].split('\n');
    let lIdx = 0, cIdx = 0, el = null;
    
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function type() {
      if (lIdx >= lines.length) {
        setTimeout(() => cursor.remove(), 500);
        if(scene) setTimeout(() => scene.classList.add('visible'), 300);
        if(sig) setTimeout(() => sig.classList.add('visible'), 1200);
        setTimeout(() => {
          typed[idx] = true;
          if(idx === 0) nextBtn.classList.add('show');
          if(idx === 1) prevBtn.classList.add('show');
        }, 1400);
        return;
      }

      const chars = Array.from(lines[lIdx]);
      if (cIdx === 0) {
        el = document.createElement('div');
        el.className = 'msg-line';
        msg.appendChild(el);
        el.appendChild(cursor);
        setTimeout(() => el.classList.add('visible'), 30);
      }

      if (cIdx < chars.length) {
        cursor.before(document.createTextNode(chars[cIdx]));
        cIdx++;
        let delay = 40 + Math.random() * 20;
        if(/[.,!?]/.test(chars[cIdx-1])) delay = 250;
        typeTimer = setTimeout(type, delay);
      } else {
        lIdx++; cIdx = 0;
        typeTimer = setTimeout(type, 300);
      }
    }
    type();
  }

  function goTo(idx, e) {
    if(idx === currSlide) return;
    clearTimeout(typeTimer);
    nextBtn.classList.remove('show'); prevBtn.classList.remove('show');

    if (idx === 1) {
      card0.classList.remove('active');
      card0.classList.add('exit');
      card1.classList.remove('exit');
      card1.classList.add('active');
    } else {
      card1.classList.remove('active');
      card1.classList.add('exit');
      card0.classList.remove('exit');
      card0.classList.add('active');
    }

    currSlide = idx;

    if(!typed[idx]) {
      setTimeout(() => typeText(idx), 600);
      if(idx === 1) spawnStardustShower(); // Hujan emas saat pindah ke kapal
    } else {
      if(idx === 0) nextBtn.classList.add('show');
      if(idx === 1) prevBtn.classList.add('show');
    }
  }

  nextBtn.onclick = (e) => goTo(1, e);
  prevBtn.onclick = (e) => goTo(0, e);

  /* =========================================
     4. OPEN / CLOSE APP
     ========================================= */
  function openApp() {
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    stage.classList.add('hidden');
    
    audio.volume = 0.6;
    audio.play().then(() => {
      isPlaying = true; musicBtn.classList.add('playing');
    }).catch(() => console.log("Autoplay block"));

    setTimeout(() => typeText(0), 900);
  }

  function closeApp() {
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    stage.classList.remove('hidden');
    audio.pause(); isPlaying = false; musicBtn.classList.remove('playing');
    clearTimeout(typeTimer);
    
    setTimeout(() => {
      currSlide = 0; typed = [false, false];
      card1.classList.remove('active', 'exit');
      card0.classList.remove('exit');
      card0.classList.add('active');
      
      document.getElementById('msg0').innerHTML = '';
      document.getElementById('msg1').innerHTML = '';
      document.getElementById('scene1').classList.remove('visible');
      document.getElementById('sig1').classList.remove('visible');
      nextBtn.classList.remove('show'); prevBtn.classList.remove('show');
      
      sceneContainer.style.transform = 'perspective(1200px) rotateX(0) rotateY(0)';
    }, 500);
  }

  window.closeApp = closeApp;
  openBtn.onclick = openApp;
  
  musicBtn.onclick = () => {
    if(isPlaying) { audio.pause(); musicBtn.classList.remove('playing'); }
    else { audio.play(); musicBtn.classList.add('playing'); }
    isPlaying = !isPlaying;
  };

})();
</script>
</body>
</html>
