<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #d4a373;
    --accent-soft: #fff2d9;
    --bg-dark: #020205;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    background-color: var(--bg-dark);
  }

  /* ============ SCENE ============ */
  .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .bg-wrap { position: absolute; inset: 0; transition: opacity 1.5s ease; will-change: transform; }

  .bg-sunflower {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    animation: kenBurns 25s ease-in-out infinite alternate;
  }
  .overlay-sunflower {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .sunflower-wrap { opacity: 1; }
  body.modal-open .sunflower-wrap { opacity: 0; }

  .bg-galaxy {
    position: absolute; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
    background-size: cover; background-position: center;
    animation: galaxyDrift 40s linear infinite alternate;
  }
  .overlay-galaxy {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(2,2,5,0.3) 0%, rgba(2,2,5,0.9) 100%);
  }
  .galaxy-wrap { opacity: 0; }
  body.modal-open .galaxy-wrap { opacity: 1; }

  @keyframes kenBurns {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.15) translate(-2%, -2%); }
  }
  @keyframes galaxyDrift {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.1) translate(2%, 2%); }
  }

  .sun-rays {
    position: absolute; inset: -30%;
    background: repeating-conic-gradient(
      from 0deg at 50% 45%,
      rgba(255, 220, 120, 0.10) 0deg 6deg,
      transparent 6deg 14deg
    );
    animation: rayRotate 90s linear infinite;
    z-index: 1; mix-blend-mode: screen;
    transition: opacity 1.5s ease;
  }
  body.modal-open .sun-rays { opacity: 0; }
  @keyframes rayRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .aurora {
    position: absolute; inset: 0; z-index: 2;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(212, 163, 115, 0.15), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(120, 100, 255, 0.10), transparent 55%);
    animation: auroraShift 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes auroraShift {
    0%   { opacity: 0.7; transform: scale(1); }
    100% { opacity: 1;   transform: scale(1.05); }
  }

  .fx-canvas { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

  .petals-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: opacity 1.2s ease; }
  body.modal-open .petals-layer { opacity: 0; }
  .petal {
    position: absolute;
    border-radius: 60% 60% 40% 40% / 50% 50% 50% 50%;
    background: radial-gradient(ellipse at 30% 30%, #ffe082, #ffb300 70%, #c67c00);
    opacity: 0.7;
    animation: petalFall linear infinite;
    will-change: transform;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }
  @keyframes petalFall {
    0%   { transform: translateY(-15vh) translateX(0) rotate(0deg); }
    50%  { transform: translateY(45vh) translateX(20px) rotate(360deg); }
    100% { transform: translateY(115vh) translateX(-10px) rotate(720deg); }
  }

  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 420px; height: 420px;
    margin: -210px 0 0 -210px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 163, 115, 0.18), transparent 60%);
    pointer-events: none; z-index: 4;
    transition: opacity 0.6s ease, background 1.2s ease;
    mix-blend-mode: screen; will-change: transform;
  }
  body.modal-open .cursor-glow {
    background: radial-gradient(circle, rgba(180, 170, 255, 0.20), transparent 60%);
  }

  /* ============ SATURN ============ */
  .saturn-system {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -60%) scale(0.8);
    width: 400px; height: 400px;
    perspective: 1200px; z-index: 1;
    opacity: 0; transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
  }
  body.modal-open .saturn-system { opacity: 1; transform: translate(-50%, -60%) scale(1); }
  .planet-wrap {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: floatPlanet 6s ease-in-out infinite alternate;
  }
  .planet-body {
    position: absolute; top: 50%; left: 50%;
    width: 160px; height: 160px;
    margin: -80px 0 0 -80px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25) 0%, transparent 40%),
      repeating-linear-gradient(0deg, #fff2d9 0%, #e6b981 10%, #a86e36 20%, #4a2208 30%, #0d0400 40%);
    background-size: 100% 200%;
    box-shadow: inset -20px -20px 50px rgba(0,0,0,1);
    z-index: 10;
    animation: planetSurface 15s linear infinite;
  }
  .planet-atmosphere {
    position: absolute; top: 50%; left: 50%;
    width: 170px; height: 170px;
    margin: -85px 0 0 -85px;
    border-radius: 50%;
    box-shadow: 0 0 50px 15px rgba(230,185,129,0.4), inset 0 0 20px rgba(230,185,129,0.3);
    z-index: 9;
    animation: pulseAtmosphere 4s ease-in-out infinite alternate;
  }
  .rings-container {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(75deg) rotateY(-20deg);
    animation: spinRings 20s linear infinite;
    z-index: 5;
  }
  .ring { position: absolute; border-radius: 50%; top: 50%; left: 50%; }
  .ring-outer {
    width: 360px; height: 360px; margin: -180px 0 0 -180px;
    border: 12px solid rgba(230,185,129,0.2);
    box-shadow: 0 0 20px rgba(230,185,129,0.2), inset 0 0 20px rgba(230,185,129,0.2);
  }
  .ring-mid {
    width: 290px; height: 290px; margin: -145px 0 0 -145px;
    border: 20px solid rgba(255,242,217,0.4);
    box-shadow: 0 0 15px rgba(255,242,217,0.35);
  }
  .ring-inner {
    width: 210px; height: 210px; margin: -105px 0 0 -105px;
    border: 8px solid rgba(168,110,54,0.6);
  }
  .moon-orbit-1 {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px; margin: -130px 0 0 -130px;
    transform: rotateX(70deg) rotateY(15deg) rotateZ(30deg);
    transform-style: preserve-3d;
    animation: orbitMoon1 8s linear infinite;
    z-index: 15;
  }
  .moon-orbit-2 {
    position: absolute; top: 50%; left: 50%;
    width: 320px; height: 320px; margin: -160px 0 0 -160px;
    transform: rotateX(60deg) rotateY(-20deg) rotateZ(-45deg);
    transform-style: preserve-3d;
    animation: orbitMoon2 12s linear infinite;
    z-index: 4;
  }
  .moon-1 {
    position: absolute; top: -6px; left: 50%;
    width: 14px; height: 14px; margin-left: -7px;
    background: radial-gradient(circle at 30% 30%, #fff, #999);
    border-radius: 50%;
    box-shadow: 0 0 15px #fff;
  }
  .moon-2 {
    position: absolute; bottom: -4px; left: 50%;
    width: 8px; height: 8px; margin-left: -4px;
    background: #bbb;
    border-radius: 50%;
    box-shadow: 0 0 8px #bbb;
  }
  @keyframes planetSurface { 0% { background-position: 0% 0%; } 100% { background-position: 0% 200%; } }
  @keyframes pulseAtmosphere {
    0% { box-shadow: 0 0 40px 10px rgba(230,185,129,0.3); }
    100% { box-shadow: 0 0 70px 22px rgba(230,185,129,0.55); }
  }
  @keyframes spinRings {
    0% { transform: rotateX(75deg) rotateY(-20deg) rotateZ(0deg); }
    100% { transform: rotateX(75deg) rotateY(-20deg) rotateZ(360deg); }
  }
  @keyframes floatPlanet {
    0% { transform: translateY(0) rotateZ(0deg); }
    100% { transform: translateY(-20px) rotateZ(2deg); }
  }
  @keyframes orbitMoon1 {
    0% { transform: rotateX(70deg) rotateY(15deg) rotateZ(0deg); }
    100% { transform: rotateX(70deg) rotateY(15deg) rotateZ(360deg); }
  }
  @keyframes orbitMoon2 {
    0% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(0deg); }
    100% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(-360deg); }
  }

  /* ============ STAGE ============ */
  .stage {
    text-align: center; padding: 24px; z-index: 5;
    position: relative;
    animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .stage.is-hidden {
    animation: none; opacity: 0;
    transform: translateY(-30px) scale(0.95);
    pointer-events: none;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 12vw, 5.5rem);
    font-weight: 600; font-style: italic; line-height: 1.1;
    color: #1a1a1a; margin-bottom: 15px;
    animation: floatText 4s ease-in-out infinite alternate, titleGlow 3s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    0%   { text-shadow: 0 4px 20px rgba(255,255,255,1); }
    100% { text-shadow: 0 4px 30px rgba(255,255,255,1), 0 0 24px rgba(212,163,115,0.55); }
  }
  .subtitle {
    font-weight: 500; letter-spacing: 5px; text-transform: uppercase;
    font-size: 0.75rem; color: #222;
    text-shadow: 0 2px 10px rgba(255,255,255,1);
    margin-bottom: 50px;
    animation: floatText 5s ease-in-out infinite alternate 1s;
  }
  @keyframes floatText {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }

  .btn {
    position: relative; overflow: hidden;
    background: #111; color: #fff;
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 18px 50px; border: none; border-radius: 50px;
    cursor: pointer;
    transition: background 0.4s ease, transform 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: pulseBtn 2s ease-in-out infinite alternate;
    isolation: isolate;
  }
  .btn:hover { background: var(--accent); transform: translateY(-3px) scale(1.04); }
  .btn:active { transform: translateY(-1px) scale(0.98); }
  .btn .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.55);
    transform: translate(-50%, -50%) scale(0);
    animation: rippleAnim 0.7s ease-out forwards;
    pointer-events: none; z-index: -1;
  }
  @keyframes rippleAnim { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
  @keyframes pulseBtn {
    0%   { box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 0 rgba(212,163,115,0); transform: translateY(0); }
    100% { box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 22px rgba(212,163,115,0.55); transform: translateY(-5px); }
  }

  /* ============ OVERLAY / CARD ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .card-content {
    position: relative;
    width: min(460px, 100%);
    max-height: 85vh; overflow-y: auto;
    padding: 50px 30px 40px;
    text-align: center;
    background: rgba(15, 15, 25, 0.25);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
    transform: translateY(30px) scale(0.95); opacity: 0;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    z-index: 10; isolation: isolate;
  }
  .overlay.open .card-content {
    transform: translateY(0) scale(1); opacity: 1;
    animation: floatCard 6s ease-in-out infinite alternate 1s;
  }
  @keyframes floatCard { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }

  .card-content::before {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 26px;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(212,163,115,0.55) 60deg,
      rgba(255,242,217,0.85) 90deg,
      rgba(212,163,115,0.55) 120deg,
      transparent 180deg,
      transparent 360deg
    );
    z-index: -1;
    animation: rotateBorder 6s linear infinite;
    filter: blur(10px); opacity: 0.75;
  }
  @keyframes rotateBorder { to { transform: rotate(360deg); } }

  .close {
    position: absolute; top: 15px; right: 15px; z-index: 20;
    width: 32px; height: 32px; border: none;
    background: rgba(255,255,255,0.1);
    border-radius: 50%; color: #ccc;
    font-size: 1.2rem; line-height: 1; cursor: pointer;
    transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .close:hover { background: var(--accent); color: #111; transform: rotate(90deg); }

  .card-flower {
    font-size: 1.6rem; display: inline-block; margin-bottom: 12px;
    animation: bob 3s ease-in-out infinite alternate;
    filter: drop-shadow(0 4px 10px rgba(212,163,115,0.5));
  }
  @keyframes bob {
    0%   { transform: translateY(0) rotate(-6deg); }
    100% { transform: translateY(-6px) rotate(6deg); }
  }

  .card-content h2 {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal; font-weight: 700; font-size: 1.8rem;
    color: var(--accent); margin-bottom: 25px;
    letter-spacing: -1px; text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }

  /* ============ SLIDES ============ */
  .slides-viewport { display: grid; overflow: hidden; position: relative; }
  .slide {
    grid-area: 1 / 1;
    display: flex; flex-direction: column;
    opacity: 0; transform: translateX(30px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .slide.enter-forward {
    animation: slideInRight 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: none;
  }
  .slide.enter-backward {
    animation: slideInLeft 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: none;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(50px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-50px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.05rem; line-height: 1.8; font-weight: 400;
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,1);
    display: flex; flex-direction: column;
    min-height: 1em; letter-spacing: -0.5px; text-align: left;
  }
  .msg-line {
    display: block; min-height: 1.5em;
    opacity: 0; transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .msg-line.visible { opacity: 1; transform: translateY(0); }

  .type-cursor {
    display: inline-block;
    width: 9px; height: 1.1em;
    background: var(--accent); margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.8s steps(1) infinite;
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(212,163,115,0.5);
    border-radius: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ SAILING SCENE (slide terakhir) ============ */
  .sailing-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 400 / 180;
    margin: 22px 0 8px;
    border-radius: 14px;
    overflow: hidden;
    background: #050510;
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.7),
      0 10px 30px rgba(0,0,0,0.45),
      0 0 0 1px rgba(212,163,115,0.18);
    opacity: 0;
    transform: translateY(20px) scale(0.98);
    transition: opacity 1.1s cubic-bezier(0.16,1,0.3,1), transform 1.1s cubic-bezier(0.16,1,0.3,1);
  }
  .sailing-scene.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .sailing-svg {
    display: block;
    width: 100%; height: 100%;
  }

  /* SVG Animations */
  .svg-stars circle {
    animation: twinkleSvg 3s ease-in-out infinite alternate;
  }
  .svg-stars circle:nth-child(2n) { animation-delay: 0.8s; animation-duration: 3.8s; }
  .svg-stars circle:nth-child(3n) { animation-delay: 1.6s; animation-duration: 4.5s; }
  .svg-stars circle:nth-child(5n) { animation-delay: 2.3s; animation-duration: 2.7s; }
  @keyframes twinkleSvg {
    0%   { opacity: 0.25; }
    100% { opacity: 1; }
  }

  .svg-moon { animation: moonGlow 4s ease-in-out infinite alternate; }
  @keyframes moonGlow {
    0%   { opacity: 0.85; }
    100% { opacity: 1; }
  }

  .wave {
    animation: waveDrift 8s ease-in-out infinite alternate;
    will-change: transform;
  }
  .wave-2 { animation-duration: 10s; animation-direction: alternate-reverse; }
  .wave-3 { animation-duration: 12s; }
  .wave-4 { animation-duration: 14s; animation-direction: alternate-reverse; }
  @keyframes waveDrift {
    0%   { transform: translateX(-12px); }
    100% { transform: translateX(12px); }
  }

  .water-sparkles circle {
    animation: waterTwinkle 4s ease-in-out infinite;
  }
  .water-sparkles circle:nth-child(2) { animation-delay: 1s; }
  .water-sparkles circle:nth-child(3) { animation-delay: 2s; }
  .water-sparkles circle:nth-child(4) { animation-delay: 3s; }
  @keyframes waterTwinkle {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.6; }
  }

  .svg-boat {
    transform-box: view-box;
    transform-origin: 200px 108px;
    animation: boatSail 10s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes boatSail {
    0%   { transform: translate(-4px, 0) rotate(-1.3deg); }
    25%  { transform: translate(0, -2px) rotate(0deg); }
    50%  { transform: translate(4px, 0) rotate(1.3deg); }
    75%  { transform: translate(0, -2px) rotate(0deg); }
    100% { transform: translate(-4px, 0) rotate(-1.3deg); }
  }

  .signature {
    font-family: 'Dancing Script', cursive;
    font-weight: 500; font-size: 1.05rem;
    color: var(--accent); margin-top: 18px;
    text-align: right;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .signature.visible { opacity: 1; transform: translateY(0); }

  /* ============ SLIDE NAV ============ */
  .slide-nav {
    display: flex; justify-content: center; align-items: center;
    gap: 14px; margin-top: 22px; min-height: 44px;
  }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(212, 163, 115, 0.4);
    background: rgba(10, 10, 15, 0.4);
    color: var(--accent); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    padding: 0;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .nav-btn.visible {
    display: flex;
    animation: navIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes navIn {
    from { opacity: 0; transform: translateY(10px) scale(0.85); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .nav-btn:hover {
    background: rgba(212, 163, 115, 0.25);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(212, 163, 115, 0.45);
    transform: translateY(-2px);
  }
  .nav-btn:active { transform: translateY(0) scale(0.95); }
  .nav-btn svg { width: 20px; height: 20px; transition: transform 0.3s ease; }
  .nav-next:hover svg { transform: translateX(3px); }
  .nav-prev:hover svg { transform: translateX(-3px); }

  /* ============ MUSIC ============ */
  .music-control {
    position: fixed; bottom: 30px; left: 30px; z-index: 100;
    width: 45px; height: 45px;
    background: rgba(10, 10, 15, 0.6);
    border: 1px solid rgba(212,163,115,0.5);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.5s ease, transform 0.3s ease, border-color 0.3s ease;
    opacity: 0; pointer-events: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    padding: 0;
  }
  body.modal-open .music-control { opacity: 1; pointer-events: auto; }
  .music-control:hover { transform: scale(1.1); border-color: var(--accent); }
  .music-control svg { width: 20px; height: 20px; fill: var(--accent); pointer-events: none; }
  .music-control.playing::after,
  .music-control.playing::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 50%; border: 1px solid var(--accent);
    animation: pulseRing 2s ease-out infinite;
    pointer-events: none;
  }
  .music-control.playing::before { animation-delay: 0.6s; }
  @keyframes pulseRing {
    0%   { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* ============ ACCESSIBILITY ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .petals-layer, .sun-rays, .aurora { display: none; }
  }

  @media (max-width: 480px) {
    .title { font-size: clamp(2.5rem, 14vw, 4rem); }
    .msg { font-size: 0.95rem; }
    .saturn-system { transform: translate(-50%, -60%) scale(0.55); }
    body.modal-open .saturn-system { transform: translate(-50%, -60%) scale(0.7); }
    .card-content { padding: 40px 20px 30px; }
    .music-control { bottom: 20px; left: 20px; width: 42px; height: 42px; }
    .overlay-sunflower { backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    .cursor-glow { display: none; }
    .nav-btn { width: 40px; height: 40px; }
    .sailing-scene { margin: 18px 0 6px; }
  }
</style>
</head>
<body>

  <div class="scene" aria-hidden="true">

          <!-- ===== SAILING SCENE ===== -->
          <div class="sailing-scene" aria-hidden="true">

                <path class="wave wave-2" d="M -20 122 Q 30 117 80 122 T 180 122 T 280 122 T 380 122 T 460 122"

                <!-- Flag -->

                <!-- Hull -->

                <!-- ===== MAN (left) ===== -->
                <g class="figure figure-man">
                  <circle cx="189" cy="82" r="3.2" fill="#0d0400"/>
                  <line x1="189" y1="85" x2="189" y2="98"
                        stroke="#0d0400" stroke-width="2.3" stroke-linecap="round"/>

                <!-- ===== WOMAN (right) ===== -->

                  <circle cx="196" cy="83" r="2.8" fill="#0d0400"/>

      <div class="slide-nav" id="slideNav">
        <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="Pesan sebelumnya">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="Pesan selanjutnya">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>

        </button>

    </div>
  </div>

<script>
(function () {
  'use strict';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ Elements ============ */
  const overlay      = document.getElementById('overlay');
  const openBtn      = document.getElementById('openBtn');
  const closeBtn     = document.getElementById('closeBtn');
  const stage        = document.getElementById('stage');
  const bgMusic      = document.getElementById('bgMusic');
  const musicBtn     = document.getElementById('musicBtn');
  const cursorGlow   = document.getElementById('cursorGlow');
  const petalsLayer  = document.getElementById('petalsLayer');
  const viewport     = document.getElementById('slidesViewport');
  const prevBtn      = document.getElementById('prevBtn');
  const nextBtn      = document.getElementById('nextBtn');
  const slides       = Array.from(viewport.querySelectorAll('.slide'));

  const MESSAGES = [
    'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\n' +
    'Ini aku lagi nyoba bikin pesan buat kamu.\n\n' +
    'Keprok atuh hahaha 👏\n\n' +
    'Semoga hal-hal baik selalu menyertai hubungan kita.',
    'Mari berlayar, membuka hal-hal baru, bersama.'
  ];

  let currentSlide = 0;
  let typed        = MESSAGES.map(() => false);
  let isMusicPlaying = false;
  let typingTimer  = null;
  let focusBeforeOpen = null;

  /* ============ Petals ============ */
  function spawnPetals() {
    if (reduceMotion) return;
    const count = window.innerWidth < 480 ? 14 : 26;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 5 + Math.random() * 8;
      p.style.width = size + 'px';
      p.style.height = (size * 1.5) + 'px';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.top = '-20px';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      p.style.animationDelay = (-Math.random() * 15) + 's';
      p.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
      petalsLayer.appendChild(p);
    }
  }
  spawnPetals();

  /* ============ Canvas FX ============ */
  const canvas = document.getElementById('fxCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let stars = [], shooters = [], sparkles = [];
  let galaxyActive = false;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initStars();
  }
  function initStars() {
    stars = [];
    if (reduceMotion) return;
    const count = Math.min(160, Math.floor((W * H) / 12000));
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.9 + 0.3,
        vx: (Math.random() - 0.5) * 0.05,
        vy: (Math.random() - 0.5) * 0.05
      });
    }
  }
  function spawnShooter() {
    const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.5;
    const speed = 8 + Math.random() * 6;
    shooters.push({
      x: Math.random() * W, y: -20,
      vx: -Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0, maxLife: 90
    });
  }
  function burst(x, y) {
    if (reduceMotion) return;
    for (let i = 0; i < 26; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 1 + Math.random() * 3.5;
      sparkles.push({
        x, y,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 0, maxLife: 40 + Math.random() * 30,
        size: 1 + Math.random() * 2,
        hue: Math.random() > 0.5 ? 40 : 45
      });
    }
  }

  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
  }, { passive: true });

  let lastShooter = 0;
  function loop(t) {
    requestAnimationFrame(loop);

    const px = (mouse.x - W / 2) * 0.03;
    const py = (mouse.y - H / 2) * 0.03;
    document.querySelectorAll('.bg-wrap').forEach(el => {
      const s = parseFloat(el.dataset.speed || '10') / 10;
      el.style.transform = `translate3d(${-px * s}px, ${-py * s}px, 0)`;
    });
    if (cursorGlow) {
      cursorGlow.style.transform = `translate3d(${mouse.x}px, ${mouse.y}px, 0)`;
    }

    if (reduceMotion) return;
    ctx.clearRect(0, 0, W, H);
    const now = t * 0.001;

    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(now * s.speed + s.phase);
      const alpha = s.base * tw * (galaxyActive ? 1 : 0.45);
      s.x += s.vx; s.y += s.vy;
      if (s.x < 0) s.x = W; else if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H; else if (s.y > H) s.y = 0;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (galaxyActive && now - lastShooter > 2.5 + Math.random() * 3) {
      spawnShooter(); lastShooter = now;
    }
    for (let i = shooters.length - 1; i >= 0; i--) {
      const sh = shooters[i];
      sh.x += sh.vx; sh.y += sh.vy; sh.life++;
      const t2 = 1 - sh.life / sh.maxLife;
      if (t2 <= 0) { shooters.splice(i, 1); continue; }
      const tailX = sh.x - sh.vx * 6;
      const tailY = sh.y - sh.vy * 6;
      const grad = ctx.createLinearGradient(tailX, tailY, sh.x, sh.y);
      grad.addColorStop(0, `rgba(255,255,255,0)`);
      grad.addColorStop(1, `rgba(255,242,217,${t2})`);
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(sh.x, sh.y); ctx.stroke();
    }

    for (let i = sparkles.length - 1; i >= 0; i--) {
      const sp = sparkles[i];
      sp.x += sp.vx; sp.y += sp.vy;
      sp.vx *= 0.96; sp.vy *= 0.96;
      sp.life++;
      const a = 1 - sp.life / sp.maxLife;
      if (a <= 0) { sparkles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.fillStyle = `hsla(${sp.hue}, 90%, 75%, ${a})`;
      ctx.arc(sp.x, sp.y, sp.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============ Ripple ============ */
  function attachRipple(btn) {
    btn.addEventListener('pointerdown', e => {
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height) * 2;
      const el = document.createElement('span');
      el.className = 'ripple';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (e.clientX - r.left) + 'px';
      el.style.top  = (e.clientY - r.top) + 'px';
      btn.appendChild(el);
      setTimeout(() => el.remove(), 720);
    });
  }
  attachRipple(openBtn);

  /* ============ Typewriter ============ */
  function typeMessage(slideIndex) {
    clearTimeout(typingTimer);
    const slide = slides[slideIndex];
    const container = slide.querySelector('.msg');
    const sig = slide.querySelector('.signature');
    const sailing = slide.querySelector('.sailing-scene');

    container.innerHTML = '';
    if (sig) sig.classList.remove('visible');
    if (sailing) sailing.classList.remove('visible');

    const lines = MESSAGES[slideIndex].split('\n');
    let lineIndex = 0;
    let charIndex = 0;
    let currentLineEl = null;

    const cursor = document.createElement('span');
    cursor.className = 'type-cursor';

    function typeLine() {
      if (lineIndex >= lines.length) {
        setTimeout(() => cursor.remove(), 800);

        if (sailing) {
          setTimeout(() => sailing.classList.add('visible'), 300);
        }
        if (sig) {
          setTimeout(() => sig.classList.add('visible'), 1600);
        }

        setTimeout(() => {
          typed[slideIndex] = true;
          showNavFor(slideIndex);
        }, 2000);
        return;
      }

      const chars = Array.from(lines[lineIndex]);

      if (charIndex === 0) {
        currentLineEl = document.createElement('div');
        currentLineEl.className = 'msg-line';
        container.appendChild(currentLineEl);
        currentLineEl.appendChild(cursor);
        setTimeout(() => currentLineEl.classList.add('visible'), 40);
      }

      if (charIndex < chars.length) {
        const ch = chars[charIndex];
        cursor.before(document.createTextNode(ch));
        charIndex++;
        let pause = 65 + Math.random() * 35;
        if (/[.,!?]/.test(ch)) pause = 320 + Math.random() * 90;
        else if (ch === ' ') pause = 110 + Math.random() * 40;
        typingTimer = setTimeout(typeLine, pause);
      } else {
        lineIndex++; charIndex = 0;
        typingTimer = setTimeout(typeLine, 380);
      }
    }
    typeLine();
  }

  /* ============ Navigation ============ */
  function showNavFor(index) {
    prevBtn.classList.toggle('visible', index > 0);
    nextBtn.classList.toggle('visible', index < MESSAGES.length - 1);
  }
  function hideNav() {
    prevBtn.classList.remove('visible');
    nextBtn.classList.remove('visible');
  }

  function updateAria() {
    slides.forEach((s, i) => {
      s.setAttribute('aria-hidden', i === currentSlide ? 'false' : 'true');
    });
  }

  function goToSlide(index) {
    if (index === currentSlide) return;
    if (index < 0 || index >= MESSAGES.length) return;

    clearTimeout(typingTimer);
    hideNav();

    const oldSlide = slides[currentSlide];
    const newSlide = slides[index];
    const direction = index > currentSlide ? 'enter-forward' : 'enter-backward';

    oldSlide.classList.remove('active', 'enter-forward', 'enter-backward');

    newSlide.classList.remove('enter-forward', 'enter-backward');
    void newSlide.offsetWidth;
    newSlide.classList.add('active', direction);

    currentSlide = index;
    updateAria();

    if (typed[index]) {
      const sig = newSlide.querySelector('.signature');
      if (sig) sig.classList.add('visible');
      const sailing = newSlide.querySelector('.sailing-scene');
      if (sailing) sailing.classList.add('visible');
      showNavFor(index);
    } else {
      setTimeout(() => typeMessage(index), 350);
    }
  }

  prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
  nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

  /* ============ Open / Close ============ */
  function resetSlides() {
    currentSlide = 0;
    typed = MESSAGES.map(() => false);
    hideNav();
    slides.forEach(s => {
      s.classList.remove('active', 'enter-forward', 'enter-backward');
      s.querySelector('.msg').innerHTML = '';
      const sig = s.querySelector('.signature');
      if (sig) sig.classList.remove('visible');
      const sailing = s.querySelector('.sailing-scene');
      if (sailing) sailing.classList.remove('visible');
    });
    slides[0].classList.add('active');
    updateAria();
  }

  function openCard() {
    focusBeforeOpen = document.activeElement;

    resetSlides();
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    stage.classList.add('is-hidden');

    bgMusic.volume = 0.6;
    const play = bgMusic.play();
    if (play && play.then) {
      play.then(() => {
        isMusicPlaying = true;
        musicBtn.classList.add('playing');
      }).catch(() => {
        isMusicPlaying = false;
        musicBtn.classList.remove('playing');
      });
    }

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    setTimeout(() => burst(cx, cy), 300);
    setTimeout(() => { burst(cx - 60, cy - 40); burst(cx + 60, cy + 40); }, 650);

    setTimeout(() => typeMessage(0), 900);
    setTimeout(() => closeBtn.focus({ preventScroll: true }), 500);
  }

  function closeCard() {
    if (!overlay.classList.contains('open')) return;

    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    stage.classList.remove('is-hidden');

    bgMusic.pause(); bgMusic.currentTime = 0;
    isMusicPlaying = false;
    musicBtn.classList.remove('playing');

    clearTimeout(typingTimer);
    setTimeout(() => resetSlides(), 500);

    if (focusBeforeOpen && focusBeforeOpen.focus) {
      focusBeforeOpen.focus({ preventScroll: true });
    }
  }

  /* ============ Music toggle ============ */
  musicBtn.addEventListener('click', () => {
    if (isMusicPlaying) {
      bgMusic.pause();
      isMusicPlaying = false;
      musicBtn.classList.remove('playing');
    } else {
      const p = bgMusic.play();
      if (p && p.then) {
        p.then(() => {
          isMusicPlaying = true;
          musicBtn.classList.add('playing');
        }).catch(() => {
          isMusicPlaying = false;
          musicBtn.classList.remove('playing');
        });
      }
    }
  });

  bgMusic.addEventListener('error', () => {
    console.warn('[music] gagal load audio');
    musicBtn.classList.remove('playing');
    isMusicPlaying = false;
  });

  /* ============ Listeners ============ */
  openBtn.addEventListener('click', openCard);
  closeBtn.addEventListener('click', closeCard);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeCard();
  });

  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;

    if (e.key === 'Escape') { closeCard(); return; }

    if (e.key === 'ArrowRight' && nextBtn.classList.contains('visible')) {
      e.preventDefault(); goToSlide(currentSlide + 1);
    }
    if (e.key === 'ArrowLeft' && prevBtn.classList.contains('visible')) {
      e.preventDefault(); goToSlide(currentSlide - 1);
    }

    if (e.key === 'Tab') {
      const focusables = Array.from(
        overlay.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')
      ).filter(el => el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0];
      const last  = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  });

  /* ============ Init ============ */
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);

  const observer = new MutationObserver(() => {
    galaxyActive = document.body.classList.contains('modal-open');
  });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) bgMusic.pause();
  });

  updateAria();
})();
</script>
</body>
</html>
