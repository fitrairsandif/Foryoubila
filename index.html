<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#050510" />
<title>Untuk Bila</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --gold: #f0d5ab;
    --gold-glow: rgba(240, 213, 171, 0.4);
    --bg-dark: #050510;
    --glass: rgba(15, 15, 25, 0.65);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  html, body { height: 100%; overflow: hidden; background-color: var(--bg-dark); }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
  }

  /* Film Grain */
  .noise {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.06;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
  }

  /* Canvas Background */
  #canvas {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(circle at 50% 0%, rgba(30, 20, 60, 0.8) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(60, 40, 20, 0.4) 0%, transparent 50%);
  }

  /* ================= STAGE (Landing) ================= */
  .stage {
    position: relative; z-index: 10; text-align: center;
    transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 0 20px;
  }
  .stage.hidden { opacity: 0; transform: scale(1.1) translateZ(100px); pointer-events: none; filter: blur(10px); }

  .reveal-wrap { overflow: hidden; display: block; }
  .title {
    font-family: 'Cinzel', serif; font-size: clamp(2.8rem, 12vw, 4rem); font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, #fff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 4px; margin-bottom: 5px;
    animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    filter: drop-shadow(0 0 20px rgba(240,213,171,0.3));
  }
  .subtitle {
    font-size: 0.7rem; font-weight: 300; letter-spacing: 6px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 50px; opacity: 0.8;
    animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
  }

  @keyframes revealUp {
    0% { opacity: 0; transform: translateY(40px); filter: blur(5px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .btn-container { animation: revealUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
  .btn {
    position: relative; padding: 16px 45px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--gold);
    border-radius: 50px; color: var(--gold);
    font-family: inherit; font-size: 0.9rem; font-weight: 600; letter-spacing: 2px;
    cursor: pointer; overflow: hidden;
    box-shadow: 0 0 30px rgba(240,213,171,0.1), inset 0 0 10px rgba(240,213,171,0.1);
    transition: all 0.4s ease;
  }
  .btn:active { transform: scale(0.95); background: rgba(240,213,171,0.2); }
  .btn::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg); animation: shine 3s infinite; pointer-events: none;
  }
  @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

  /* ================= OVERLAY & CARDS CONTAINER ================= */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; justify-content: center; align-items: center;
    background: rgba(5,5,10,0.3); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden; transition: all 0.6s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .cards-container {
    width: 88vw; max-width: 420px;
    display: grid; grid-template-columns: 1fr;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
  }

  /* ================= INDIVIDUAL CARDS ================= */
  .card {
    grid-area: 1 / 1; /* Menumpuk kedua kartu di posisi yang sama */
    position: relative; width: 100%; max-height: 80vh; overflow-y: auto; overscroll-behavior: contain;
    padding: 40px 30px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
    border-radius: 24px; border: 1px solid var(--glass-border);
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
    
    /* Animasi Default (Sembunyi) */
    opacity: 0; transform: translateX(40px) scale(0.9);
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none; z-index: 1;
    transform-style: preserve-3d;
  }

  /* Kartu yang Aktif */
  .card.active {
    opacity: 1; transform: translateX(0) scale(1);
    pointer-events: auto; z-index: 2;
  }

  /* Kartu yang Keluar (Mundur ke kiri) */
  .card.exit-back {
    opacity: 0; transform: translateX(-40px) scale(0.9);
    pointer-events: none; z-index: 1;
  }

  /* Spotlight Effect */
  .card::before {
    content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
    background: radial-gradient(400px circle at var(--x, 50%) var(--y, 50%), rgba(240,213,171,0.1), transparent 40%);
    pointer-events: none;
  }

  .close {
    position: absolute; top: 15px; right: 15px; width: 32px; height: 32px;
    border-radius: 50%; background: rgba(255,255,255,0.05); border: none;
    color: #aaa; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10; transition: 0.3s;
  }
  .close:active { background: var(--gold); color: #000; }

  /* ================= TEXT & CONTENT ================= */
  .msg {
    font-size: 1rem; line-height: 1.8; font-weight: 300; color: #eaeaea;
    text-align: left; min-height: 100px; letter-spacing: 0.5px;
  }
  .msg-line { display: block; min-height: 1.5em; opacity: 0; transform: translateY(10px); transition: 0.5s; }
  .msg-line.visible { opacity: 1; transform: translateY(0); }
  
  .cursor {
    display: inline-block; width: 6px; height: 1em; background: var(--gold);
    margin-left: 3px; vertical-align: -1px; animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ================= SAILING SCENE ================= */
  .scene {
    width: 100%; aspect-ratio: 16/11; margin: 20px 0 10px; border-radius: 12px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(20px) scale(0.95); transition: 0.8s ease;
  }
  .scene.visible { opacity: 1; transform: translateY(0) scale(1); }
  .scene svg { width: 100%; height: 100%; display: block; }

  /* Animasi Kapal & Air */
  .moon { animation: pulseMoon 4s infinite alternate; transform-origin: center; }
  @keyframes pulseMoon { 0% { opacity: 0.8; } 100% { opacity: 1; filter: drop-shadow(0 0 10px #fff); } }
  .wave-1 { animation: wave 8s linear infinite; }
  .wave-2 { animation: wave 12s linear infinite reverse; }
  .wave-3 { animation: wave 16s linear infinite; }
  @keyframes wave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .boat { transform-box: view-box; transform-origin: 200px 110px; animation: rock 6s ease-in-out infinite; }
  @keyframes rock { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
  .shooting-star { animation: shoot 3s ease-in infinite; }
  @keyframes shoot {
    0% { transform: translate(300px, 20px); opacity: 1; }
    20% { transform: translate(100px, 80px); opacity: 0; }
    100% { transform: translate(100px, 80px); opacity: 0; }
  }

  .signature {
    font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold);
    text-align: right; margin-top: 15px; opacity: 0; transform: translateY(10px); transition: 0.8s ease 0.5s;
  }
  .signature.visible { opacity: 1; transform: translateY(0); }

  /* ================= NAVIGATION ================= */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; transform: translateZ(30px); }
  .nav-btn {
    background: transparent; border: none; color: var(--gold);
    font-family: inherit; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px;
    display: none; align-items: center; gap: 5px; padding: 10px 0; cursor: pointer;
  }
  .nav-btn.show { display: flex; animation: fadeIn 0.4s ease; }
  .nav-btn svg { width: 16px; height: 16px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ================= MUSIC PLAYER ================= */
  .music {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 20px)); left: 20px;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px;
    background: rgba(10,10,15,0.8); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
    border-radius: 50px; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s;
  }
  body.modal-open .music { opacity: 1; pointer-events: auto; }
  .music svg { width: 14px; height: 14px; fill: var(--gold); }
  .icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .bar { width: 2px; height: 100%; background: var(--gold); border-radius: 1px; transform-origin: bottom; transform: scaleY(0.2); }
  .music.playing .bar { animation: eq 0.8s ease-in-out infinite alternate; }
  .music.playing .bar:nth-child(1) { animation-duration: 0.6s; }
  .music.playing .bar:nth-child(2) { animation-duration: 0.9s; }
  .music.playing .bar:nth-child(3) { animation-duration: 0.7s; }
  .music.playing .bar:nth-child(4) { animation-duration: 1s; }
  @keyframes eq { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
</style>
</head>
<body>

  <div class="noise"></div>
  <canvas id="canvas"></canvas>

  <audio id="audio" loop preload="auto">
    <source src="https://archive.org/download/lobo_20250503/Lobo.mp3" type="audio/mpeg">
  </audio>

  <div class="music" id="musicBtn">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </div>

  <main class="stage" id="stage">
    <div class="reveal-wrap"><h1 class="title">Untuk Bila</h1></div>
    <p class="subtitle">A Journey For You</p>
    <div class="btn-container">
      <button class="btn" id="openBtn">Buka Pesan</button>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="cards-container" id="cardsContainer">
      
      <!-- KARTU 1 -->
      <div class="card active" id="card0">
        <button class="close" onclick="closeApp()">&times;</button>
        <p class="msg" id="msg0"></p>
        <div class="nav">
          <button class="nav-btn next" id="nextBtn">
            Lanjut <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>

      <!-- KARTU 2 -->
      <div class="card" id="card1">
        <button class="close" onclick="closeApp()">&times;</button>
        <p class="msg" id="msg1"></p>
        
        <div class="scene" id="scene1">
          <svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#050510"/>
                <stop offset="60%" stop-color="#101025"/>
                <stop offset="100%" stop-color="#1a1835"/>
              </linearGradient>
              <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#101030"/>
                <stop offset="100%" stop-color="#020205"/>
              </linearGradient>
              <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(255, 240, 200, 0.9)"/>
                <stop offset="40%" stop-color="rgba(255, 240, 200, 0.3)"/>
                <stop offset="100%" stop-color="rgba(255, 240, 200, 0)"/>
              </radialGradient>
            </defs>

            <rect width="400" height="140" fill="url(#sky)"/>
            <line class="shooting-star" x1="300" y1="20" x2="280" y2="40" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M0,120 Q50,90 120,110 T250,100 T400,115 L400,140 L0,140 Z" fill="#0b0b1a" opacity="0.6"/>
            <path d="M-50,135 Q80,110 180,130 T450,120 L450,140 L-50,140 Z" fill="#080812" opacity="0.8"/>

            <g class="moon">
              <circle cx="320" cy="45" r="40" fill="url(#moonGlow)"/>
              <circle cx="320" cy="45" r="12" fill="#fff8ea"/>
            </g>

            <rect y="140" width="400" height="85" fill="url(#ocean)"/>
            
            <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
              <path class="wave-1" d="M -200 150 Q -150 145 -100 150 T 0 150 T 100 150 T 200 150 T 300 150 T 400 150 T 500 150 T 600 150" />
              <path class="wave-2" d="M -200 170 Q -120 165 -40 170 T 120 170 T 280 170 T 440 170 T 600 170" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
              <path class="wave-3" d="M -200 195 Q -80 188 40 195 T 280 195 T 520 195 T 600 195" stroke="rgba(255,255,255,0.05)" stroke-width="2.5" />
            </g>

            <g class="boat">
              <circle cx="200" cy="135" r="8" fill="rgba(255, 200, 100, 0.3)" filter="blur(2px)"/>
              <circle cx="200" cy="135" r="2" fill="#ffcc80"/>
              <line x1="200" y1="90" x2="200" y2="140" stroke="#0a0a0a" stroke-width="2" />
              <path d="M 200 90 Q 170 110 165 138 L 200 138 Z" fill="#151515" />
              <path d="M 200 90 Q 230 110 235 138 L 200 138 Z" fill="#1d1d1d" />
              <path d="M 155 138 Q 175 150 200 150 Q 225 150 245 138 Q 200 145 155 138 Z" fill="#050505" />
              <circle cx="192" cy="118" r="3" fill="#050505"/>
              <line x1="192" y1="121" x2="192" y2="140" stroke="#050505" stroke-width="2.5" />
              <circle cx="200" cy="120" r="2.8" fill="#050505"/>
              <path d="M 197 123 L 203 123 L 204 140 L 196 140 Z" fill="#050505" />
              <circle cx="196" cy="128" r="5" fill="rgba(255,200,100,0.2)" filter="blur(1px)"/>
            </g>
          </svg>
        </div>
        
        <p class="signature" id="sig1">— Fitra</p>
        
        <div class="nav">
          <button class="nav-btn prev" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg> Kembali
          </button>
        </div>
      </div>

    </div>
  </div>

<script>
(function() {
  'use strict';

  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

  /* =========================================
     1. PARTICLE ENGINE (Magical Fireflies)
     ========================================= */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const mouse = { x: -1000, y: -1000, radius: 120 };

  function initCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    particles = [];
    const count = isTouch ? 40 : 80;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        size: Math.random() * 2 + 1
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      let dx = mouse.x - p.x, dy = mouse.y - p.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        p.x -= dx / dist * force * 5;
        p.y -= dy / dist * force * 5;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240, 213, 171, ${Math.random() * 0.5 + 0.3})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#f0d5ab';
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        let dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(240, 213, 171, ${0.1 - dist/800})`;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', initCanvas);
  initCanvas();
  draw();

  /* =========================================
     2. INTERAKSI (Touch & Gyro Parallax)
     ========================================= */
  if (isTouch) {
    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      mouse.x = t.clientX; mouse.y = t.clientY;
    }, { passive: true });
    window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

    window.addEventListener('deviceorientation', (e) => {
      if (!e.gamma || !e.beta) return;
      const tiltX = Math.max(Math.min(e.gamma, 30), -30);
      const tiltY = Math.max(Math.min(e.beta - 45, 30), -30);
      canvas.style.transform = `translate(${-tiltX}px, ${-tiltY}px) scale(1.05)`;
    });
  } else {
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
  }

  /* =========================================
     3. LOGIKA KARTU & TYPEWRITER
     ========================================= */
  const overlay = document.getElementById('overlay');
  const openBtn = document.getElementById('openBtn');
  const stage = document.getElementById('stage');
  const cardsContainer = document.getElementById('cardsContainer');
  
  const card0 = document.getElementById('card0');
  const card1 = document.getElementById('card1');
  
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  
  const audio = document.getElementById('audio');
  const musicBtn = document.getElementById('musicBtn');
  let isPlaying = false;

  const texts = [
    'Bilaa, semangat yaa kerjanyaa 🌻🫶\n\nIni aku lagi nyoba bikin sesuatu buat kamu.\n\nKeprok atuh hahaha 👏\n\nSemoga hal-hal baik selalu menyertai hubungan kita.',
    'Mari berlayar, membuka hal-hal baru, bersama.'
  ];

  let currSlide = 0;
  let typed = [false, false];
  let typeTimer;

  function typeText(idx) {
    clearTimeout(typeTimer);
    const msg = document.getElementById('msg' + idx);
    const scene = document.getElementById('scene' + idx);
    const sig = document.getElementById('sig' + idx);
    
    msg.innerHTML = '';
    if(scene) scene.classList.remove('visible');
    if(sig) sig.classList.remove('visible');

    const lines = texts[idx].split('\n');
    let lIdx = 0, cIdx = 0, el = null;
    
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function type() {
      if (lIdx >= lines.length) {
        setTimeout(() => cursor.remove(), 500);
        if(scene) setTimeout(() => scene.classList.add('visible'), 200);
        if(sig) setTimeout(() => sig.classList.add('visible'), 1000);
        setTimeout(() => {
          typed[idx] = true;
          if(idx === 0) nextBtn.classList.add('show');
          if(idx === 1) prevBtn.classList.add('show');
        }, 1200);
        return;
      }

      const chars = Array.from(lines[lIdx]);
      if (cIdx === 0) {
        el = document.createElement('div');
        el.className = 'msg-line';
        msg.appendChild(el);
        el.appendChild(cursor);
        setTimeout(() => el.classList.add('visible'), 30);
      }

      if (cIdx < chars.length) {
        cursor.before(document.createTextNode(chars[cIdx]));
        cIdx++;
        let delay = 40 + Math.random() * 20;
        if(/[.,!?]/.test(chars[cIdx-1])) delay = 200;
        typeTimer = setTimeout(type, delay);
      } else {
        lIdx++; cIdx = 0;
        typeTimer = setTimeout(type, 250);
      }
    }
    type();
  }

  function goTo(idx) {
    if(idx === currSlide) return;
    clearTimeout(typeTimer);
    nextBtn.classList.remove('show'); prevBtn.classList.remove('show');

    if (idx === 1) {
      // Pindah ke Kartu 2 (Maju)
      card0.classList.remove('active');
      card0.classList.add('exit-forward');
      card1.classList.remove('exit-back');
      card1.classList.add('active');
    } else {
      // Pindah ke Kartu 1 (Mundur)
      card1.classList.remove('active');
      card1.classList.add('exit-back');
      card0.classList.remove('exit-forward');
      card0.classList.add('active');
    }

    currSlide = idx;

    if(!typed[idx]) {
      setTimeout(() => typeText(idx), 400);
    } else {
      if(idx === 0) nextBtn.classList.add('show');
      if(idx === 1) prevBtn.classList.add('show');
    }
  }

  nextBtn.onclick = () => goTo(1);
  prevBtn.onclick = () => goTo(0);

  /* =========================================
     4. OPEN / CLOSE APP
     ========================================= */
  function openApp() {
    overlay.classList.add('open');
    document.body.classList.add('modal-open');
    stage.classList.add('hidden');
    
    audio.volume = 0.5;
    audio.play().then(() => {
      isPlaying = true; musicBtn.classList.add('playing');
    }).catch(() => console.log("Autoplay block"));

    setTimeout(() => typeText(0), 600);
  }

  function closeApp() {
    overlay.classList.remove('open');
    document.body.classList.remove('modal-open');
    stage.classList.remove('hidden');
    audio.pause(); isPlaying = false; musicBtn.classList.remove('playing');
    clearTimeout(typeTimer);
    
    setTimeout(() => {
      currSlide = 0; typed = [false, false];
      card1.classList.remove('active', 'exit-back');
      card0.classList.remove('exit-forward');
      card0.classList.add('active');
      
      document.getElementById('msg0').innerHTML = '';
      document.getElementById('msg1').innerHTML = '';
      document.getElementById('scene1').classList.remove('visible');
      document.getElementById('sig1').classList.remove('visible');
      nextBtn.classList.remove('show'); prevBtn.classList.remove('show');
      
      cardsContainer.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
    }, 500);
  }

  openBtn.onclick = openApp;
  musicBtn.onclick = () => {
    if(isPlaying) { audio.pause(); musicBtn.classList.remove('playing'); }
    else { audio.play(); musicBtn.classList.add('playing'); }
    isPlaying = !isPlaying;
  };

  /* =========================================
     5. SPOTLIGHT & 3D TILT
     ========================================= */
  cardsContainer.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    const activeCard = document.querySelector('.card.active');
    if(!activeCard) return;

    const rect = activeCard.getBoundingClientRect();
    const x = t.clientX - rect.left;
    const y = t.clientY - rect.top;
    
    activeCard.style.setProperty('--x', `${x}px`);
    activeCard.style.setProperty('--y', `${y}px`);

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotX = ((y - centerY) / centerY) * -5;
    const rotY = ((x - centerX) / centerX) * 5;
    cardsContainer.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }, { passive: true });

  cardsContainer.addEventListener('touchend', () => {
    cardsContainer.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
  });

})();
</script>
</body>
</html>
